# Fly.io: fly launch --copy-config, then fly volumes create data --size 1, then
# fly secrets set Admin__Email=you@example.com Admin__Password=… (the first admin: Data/Setup.cs), then fly deploy.
# Pages are static and the sign-in and form keys are in the database, so any machine can serve any request: no
# sticky sessions. SQLite on a volume keeps it to one machine; for more, move the database to Postgres.
app = "{{HostName}}"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/Account/Login"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "512mb"
