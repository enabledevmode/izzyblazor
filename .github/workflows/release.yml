name: Release

# Publishes the packages (IzzyBlazor, IzzyBlazor.Core, IzzyBlazor.Templates, IzzyBlazor.Cli) to nuget.org when a version tag (v0.1.0-alpha.1) is pushed.
# Trusted publishing: NuGet/login trades GitHub's OIDC token for a one-hour API key,
# so no NuGet key is stored anywhere. The nuget.org policy names this file (release.yml),
# the enabledevmode/izzyblazor repository and the "release" environment.
#
# "build" checks, builds, tests (unless CI already passed on the tagged commit) and packs with read-only access, so the npm and build tools never
# run where a publishing token can be had (the private catalog is cloned before npm installs
# anything, and its token is gone by then); "account-catalog" sends the account's templates to the
# account service; "publish" only takes the packages build made, logs in to NuGet and pushes. Who may push v* tags, and approval for the "release" environment,
# are repository settings: this file can't enforce them, since a tag runs its own copy of it.
# A third, "docs", deploys the docs site to Fly.io after the packages are pushed.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        # Only tags on main, and only the version the packages will carry.
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tag isn't on main."; exit 1; }
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '\r')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match <Version>$version</Version>."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The tag is on a commit of main, which CI tested when it was pushed. When that run passed, its
      # tests aren't run again here: the same commit builds the same code. Otherwise (CI still
      # running, failed or never ran) this job runs them itself.
      - name: CI's result for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json conclusion --jq '.[0].conclusion // ""' || true)
          echo "CI on $GITHUB_SHA: ${result:-none}"
          echo "passed=$([ "$result" = success ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402  # pinned: 10.0.403 download 409s from Microsoft origin; revert to 10.0.x once fixed

      # No dependency cache: these packages get published, so the build shouldn't restore files
      # another run saved.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # The account items' templates (shells, blocks, the CRM kit) are in the private catalog. With the
      # PRO_CATALOG_TOKEN secret (read access to its contents) it is checked out and the tests that
      # generate from it run; without it (a fork's pull request) they skip.
      # Before npm ci: a tool installed there could otherwise watch for the token.
      - name: Private catalog
        env:
          PRO_CATALOG_TOKEN: ${{ secrets.PRO_CATALOG_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PRO_CATALOG_TOKEN" ]; then echo "::warning::No PRO_CATALOG_TOKEN: tests of account items are skipped."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${PRO_CATALOG_TOKEN}@github.com/enabledevmode/izzyblazor-pro-catalog.git" "$RUNNER_TEMP/izzyblazor-pro-catalog"
          # The clone's config holds the token: gone before any build tool runs.
          rm -rf "$RUNNER_TEMP/izzyblazor-pro-catalog/.git"
          echo "IZZY_PRO_CATALOG=$RUNNER_TEMP/izzyblazor-pro-catalog" >> "$GITHUB_ENV"

      - name: Install asset tools
        run: npm ci

      - name: Build
        run: dotnet build izzyblazor.sln --configuration Release

      # Chromium and its system libraries, for the site's browser tests.
      - name: Install Chromium
        if: steps.ci.outputs.passed != 'true'
        # When apt can't reach Ubuntu's mirrors, fall back to Chromium alone: the runner image
        # already has most of its libraries, and the browser test says if one is missing.
        shell: bash
        run: |
          pw=site/IzzyBlazor.Site.Tests/bin/Release/net10.0/playwright.ps1
          pwsh $pw install --with-deps chromium || { echo "::warning::System packages didn't install; installing Chromium alone."; pwsh $pw install chromium; }

      - name: Unit and render tests
        if: steps.ci.outputs.passed != 'true'
        run: dotnet test izzyblazor.sln --configuration Release --no-build

      - name: Asset size budget
        shell: bash
        run: bash build/asset-budget.sh

      - name: Pack
        # IzzyBlazor.Core carries the component data the CLI's build made, for izzy to read from an app's package.
        shell: bash
        run: |
          data="$PWD/src/IzzyBlazor.Cli/obj/Release/components.json"
          test -f "$data" || { echo "::error::No component data at $data."; exit 1; }
          dotnet pack izzyblazor.sln --configuration Release --no-build --output artifacts -p:IzzyComponentsData="$data"
          unzip -l artifacts/IzzyBlazor.Core.*.nupkg | grep -q "tools/izzy/components.json" || { echo "::error::IzzyBlazor.Core was packed without tools/izzy/components.json."; exit 1; }

      - name: Release notes
        # docs/releases/<tag>.md, when there is one, heads the GitHub release's notes.
        run: |
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then cp "docs/releases/$GITHUB_REF_NAME.md" artifacts/release-notes.md; fi

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/release-notes.md
          if-no-files-found: error

  account-catalog:
    # izzy downloads the account's templates for its own version from the account service, so each
    # release sends its bundle there (the service signs it). A job of its own: it holds the upload
    # token, and nothing from npm runs here, only the CLI's own build. The bundle is never an
    # artifact: this repo is public and the templates are not. Skipped, with a warning, without the
    # ACCOUNT_UPLOAD_TOKEN and PRO_CATALOG_TOKEN secrets.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402  # pinned: 10.0.403 download 409s from Microsoft origin; revert to 10.0.x once fixed

      - name: Private catalog
        env:
          PRO_CATALOG_TOKEN: ${{ secrets.PRO_CATALOG_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PRO_CATALOG_TOKEN" ]; then echo "::warning::No PRO_CATALOG_TOKEN: the account catalog for $VERSION was not published."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${PRO_CATALOG_TOKEN}@github.com/enabledevmode/izzyblazor-pro-catalog.git" "$RUNNER_TEMP/izzyblazor-pro-catalog"
          rm -rf "$RUNNER_TEMP/izzyblazor-pro-catalog/.git"
          echo "IZZY_PRO_CATALOG=$RUNNER_TEMP/izzyblazor-pro-catalog" >> "$GITHUB_ENV"

      - name: Build izzy
        if: env.IZZY_PRO_CATALOG != ''
        run: dotnet build src/IzzyBlazor.Cli --configuration Release -p:IzzyComponents=false

      - name: Send the bundle
        if: env.IZZY_PRO_CATALOG != ''
        env:
          ACCOUNT_UPLOAD_TOKEN: ${{ secrets.ACCOUNT_UPLOAD_TOKEN }}
        shell: bash
        run: |
          if [ -z "$ACCOUNT_UPLOAD_TOKEN" ]; then echo "::warning::No ACCOUNT_UPLOAD_TOKEN: the account catalog for $VERSION was not published."; exit 0; fi
          dotnet src/IzzyBlazor.Cli/bin/Release/net10.0/IzzyBlazor.Cli.dll bundle "$RUNNER_TEMP/account.zip"
          curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $ACCOUNT_UPLOAD_TOKEN" --data-binary @"$RUNNER_TEMP/account.zip" "https://account.izzyblazor.com/v1/admin/catalog/$VERSION"
          rm "$RUNNER_TEMP/account.zip"
          # Pro's copy: the whole private catalog, with the audit pack. It goes to accounts with Pro or its preview.
          dotnet src/IzzyBlazor.Cli/bin/Release/net10.0/IzzyBlazor.Cli.dll bundle "$RUNNER_TEMP/pro.zip" --pro
          curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $ACCOUNT_UPLOAD_TOKEN" --data-binary @"$RUNNER_TEMP/pro.zip" "https://account.izzyblazor.com/v1/admin/catalog/$VERSION?tier=pro"
          rm "$RUNNER_TEMP/pro.zip"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # the GitHub release
      id-token: write   # the OIDC token NuGet/login exchanges
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402  # pinned: 10.0.403 download 409s from Microsoft origin; revert to 10.0.x once fixed

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      # Last before the push: the key it returns lasts an hour.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        # The key goes in through the environment, never pasted into the script the log shows.
        # The .snupkg symbol packages go up with their .nupkg. Core first: IzzyBlazor depends on it.
        # The templates and the izzy tool last: the projects they make reference this version of IzzyBlazor.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/IzzyBlazor.Core.*.nupkg artifacts/IzzyBlazor.[0-9]*.nupkg artifacts/IzzyBlazor.Templates.*.nupkg artifacts/IzzyBlazor.Cli.*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          notes=()
          if [ -f artifacts/release-notes.md ]; then notes=(--notes-file artifacts/release-notes.md); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${notes[@]}" $prerelease

  docs:
    # The docs site on Fly.io (fly.toml, Dockerfile), once the packages are out, so its "Added in"
    # and API pages match the release. Fly's builder builds the image; this job only holds the token.
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    concurrency: docs-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6, pinned: it runs beside the deploy token

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --ha=false: one machine (see fly.toml), even when a deploy has to create it.
        run: flyctl deploy --remote-only --ha=false
