name: Release

# Publishes both packages to nuget.org when a version tag (v0.1.0-alpha.1) is pushed.
# Trusted publishing: NuGet/login trades GitHub's OIDC token for a one-hour API key,
# so no NuGet key is stored anywhere. The nuget.org policy names this file (release.yml),
# the enabledevmode/izzyblazor repository and the "release" environment.
#
# Two jobs: "build" checks, builds, tests and packs with read-only access, so the npm and build
# tools never run where a publishing token can be had; "publish" only takes the packages it made,
# logs in to NuGet and pushes. Who may push v* tags, and approval for the "release" environment,
# are repository settings: this file can't enforce them, since a tag runs its own copy of it.
# A third, "docs", deploys the docs site to Fly.io after the packages are pushed.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        # Only tags on main, and only the version the packages will carry.
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tag isn't on main."; exit 1; }
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '\r')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match <Version>$version</Version>."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402  # pinned: 10.0.403 download 409s from Microsoft origin; revert to 10.0.x once fixed

      # No dependency cache: these packages get published, so the build shouldn't restore files
      # another run saved.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install asset tools
        run: npm ci

      - name: Build
        run: dotnet build izzyblazor.sln --configuration Release

      # Chromium and its system libraries, for the site's browser test (ToolbarWidthTests).
      - name: Install Chromium
        run: pwsh site/IzzyBlazor.Site.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit and render tests
        run: dotnet test izzyblazor.sln --configuration Release --no-build

      - name: Asset size budget
        shell: bash
        run: |
          shopt -s nullglob
          css=$(gzip -c src/IzzyBlazor.Core/wwwroot/izzyblazor.css | wc -c)
          js=$(gzip -c src/IzzyBlazor.Core/wwwroot/IzzyBlazor.Core.lib.module.js | wc -c)
          date=$(gzip -c src/IzzyBlazor.Core/wwwroot/date.css | wc -c)
          carousel=$(gzip -c src/IzzyBlazor.Core/wwwroot/carousel.css | wc -c)
          chart=$(gzip -c src/IzzyBlazor.Core/wwwroot/chart.css | wc -c)
          heatmap=$(gzip -c src/IzzyBlazor.Core/wwwroot/heatmap.css | wc -c)
          radar=$(gzip -c src/IzzyBlazor.Core/wwwroot/radar.css | wc -c)
          sankey=$(gzip -c src/IzzyBlazor.Core/wwwroot/sankey.css | wc -c)
          treemap=$(gzip -c src/IzzyBlazor.Core/wwwroot/treemap.css | wc -c)
          tabsedit=$(gzip -c src/IzzyBlazor.Core/wwwroot/tabs-edit.css | wc -c)
          speeddial=$(gzip -c src/IzzyBlazor.Core/wwwroot/speed-dial.css | wc -c)
          treeselect=$(gzip -c src/IzzyBlazor.Core/wwwroot/treeselect.css | wc -c)
          bands=$(gzip -c src/IzzyBlazor.Core/wwwroot/bands.css | wc -c)
          picker=$(gzip -c src/IzzyBlazor.Core/wwwroot/column-picker.css | wc -c)
          richtext=$(gzip -c src/IzzyBlazor.Core/wwwroot/rich-text.css | wc -c)
          richcontent=$(gzip -c src/IzzyBlazor.Core/wwwroot/rich-content.css | wc -c)
          colorpanel=$(gzip -c src/IzzyBlazor.Core/wwwroot/color-panel.css | wc -c)
          chat=$(gzip -c src/IzzyBlazor.Core/wwwroot/chat.css | wc -c)
          quote=$(gzip -c src/IzzyBlazor.Core/wwwroot/blockquote.css | wc -c)
          rangesel=$(gzip -c src/IzzyBlazor.Core/wwwroot/range-selector.css | wc -c)
          sched=$(gzip -c src/IzzyBlazor.Core/wwwroot/scheduler.css | wc -c)
          echo "CSS gzip: $css bytes (budget 52224)"
          echo "date.css gzip: $date bytes (budget 3072; only pages with a calendar load it)"
          echo "carousel.css gzip: $carousel bytes (budget 2048; only pages with a carousel load it)"
          echo "chart.css gzip: $chart bytes (budget 6144; only pages with a chart load it)"
          echo "heatmap.css gzip: $heatmap bytes (budget 2048; only pages with a HeatmapChart or CalendarHeatmap load it)"
          echo "radar.css gzip: $radar bytes (budget 1024; only pages with a RadarChart load it)"
          echo "sankey.css gzip: $sankey bytes (budget 1024; only pages with a SankeyChart load it)"
          echo "treemap.css gzip: $treemap bytes (budget 1024; only pages with a TreemapChart load it)"
          echo "tabs-edit.css gzip: $tabsedit bytes (budget 1024; only tabs with close or add controls load it)"
          echo "speed-dial.css gzip: $speeddial bytes (budget 1024; only pages with a SpeedDial load it)"
          echo "treeselect.css gzip: $treeselect bytes (budget 1024; only pages with a TreeSelect load it)"
          echo "bands.css gzip: $bands bytes (budget 1024; only tables with column bands load it)"
          echo "column-picker.css gzip: $picker bytes (budget 1024; only grids with a column picker load it)"
          echo "rich-text.css gzip: $richtext bytes (budget 2048; only pages with a RichTextEditor load it)"
          echo "rich-content.css gzip: $richcontent bytes (budget 1024; only pages with rich text that uses its classes load it)"
          echo "color-panel.css gzip: $colorpanel bytes (budget 2048; only pages with a ColorPanel load it)"
          echo "chat.css gzip: $chat bytes (budget 2048; only pages with a Chat load it)"
          echo "blockquote.css gzip: $quote bytes (budget 1024; only pages with a Blockquote load it)"
          echo "range-selector.css gzip: $rangesel bytes (budget 2048; only charts with a RangeSelector load it)"
          echo "scheduler.css gzip: $sched bytes (budget 3072; only pages with a Scheduler load it)"
          echo "JS gzip:  $js bytes (budget 15360; every page loads it)"
          # Elements most pages don't have load on demand, one file each (Scripts/lazy.ts).
          # The built files must be exactly the ones lazy.ts loads.
          expected=$(grep -A1 'const lazyNames =' src/IzzyBlazor.Core/Scripts/lazy.ts | grep -o '"[a-z -]*"' | head -1 | tr -d '"' | tr ' ' '\n' | sed 's|$|.js|' | sort)
          files=(src/IzzyBlazor.Core/wwwroot/elements/*.js)
          built=$(for f in "${files[@]}"; do basename "$f"; done | sort)
          echo "On-demand elements: ${#files[@]} files"
          test -n "$expected" && test "$built" = "$expected"
          big=0
          richcore=0
          for f in "${files[@]}"; do
            n=$(gzip -c "$f" | wc -c)
            echo "  $(basename "$f"): $n bytes"
            # The rich text editor's core has a budget of its own (its features are parts).
            if [ "$(basename "$f")" = "rich-text.js" ]; then richcore=$n; continue; fi
            if [ "$n" -gt "$big" ]; then big=$n; fi
          done
          # Parts an element loads only when needed (elements/parts), on the same budget.
          for f in src/IzzyBlazor.Core/wwwroot/elements/parts/*.js; do
            n=$(gzip -c "$f" | wc -c)
            echo "  parts/$(basename "$f"): $n bytes"
            if [ "$n" -gt "$big" ]; then big=$n; fi
          done
          echo "Largest on-demand element: $big bytes (budget 6144)"
          echo "rich-text.js: $richcore bytes (budget 8192; its tables, images, links, formats and Markdown are parts)"
          test "$css" -le 52224 && test "$date" -le 3072 && test "$carousel" -le 2048 && test "$chart" -le 6144 && test "$heatmap" -le 2048 && test "$radar" -le 1024 && test "$sankey" -le 1024 && test "$treemap" -le 1024 && test "$tabsedit" -le 1024 && test "$speeddial" -le 1024 && test "$treeselect" -le 1024 && test "$bands" -le 1024 && test "$picker" -le 1024 && test "$richtext" -le 2048 && test "$richcontent" -le 1024 && test "$colorpanel" -le 2048 && test "$chat" -le 2048 && test "$quote" -le 1024 && test "$rangesel" -le 2048 && test "$sched" -le 3072 && test "$js" -le 15360 && test "$big" -le 6144 && test "$richcore" -le 8192

      - name: Pack
        run: dotnet pack izzyblazor.sln --configuration Release --no-build --output artifacts

      - name: Release notes
        # docs/releases/<tag>.md, when there is one, heads the GitHub release's notes.
        run: |
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then cp "docs/releases/$GITHUB_REF_NAME.md" artifacts/release-notes.md; fi

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # the GitHub release
      id-token: write   # the OIDC token NuGet/login exchanges
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402  # pinned: 10.0.403 download 409s from Microsoft origin; revert to 10.0.x once fixed

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      # Last before the push: the key it returns lasts an hour.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        # The key goes in through the environment, never pasted into the script the log shows.
        # The .snupkg symbol packages go up with their .nupkg. Core first: IzzyBlazor depends on it.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/IzzyBlazor.Core.*.nupkg artifacts/IzzyBlazor.[0-9]*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          notes=()
          if [ -f artifacts/release-notes.md ]; then notes=(--notes-file artifacts/release-notes.md); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${notes[@]}" $prerelease

  docs:
    # The docs site on Fly.io (fly.toml, Dockerfile), once the packages are out, so its "Added in"
    # and API pages match the release. Fly's builder builds the image; this job only holds the token.
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    concurrency: docs-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --ha=false: one machine (see fly.toml), even when a deploy has to create it.
        run: flyctl deploy --remote-only --ha=false
