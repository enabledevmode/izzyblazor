name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402  # pinned: 10.0.403 download 409s from Microsoft origin; revert to 10.0.x once fixed

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install asset tools
        run: npm ci

      - name: Build
        run: dotnet build izzyblazor.sln --configuration Release

      # Chromium and its system libraries, for the site's browser test (ToolbarWidthTests).
      - name: Install Chromium
        run: pwsh site/IzzyBlazor.Site.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit and render tests
        run: dotnet test izzyblazor.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Asset size budget
        shell: bash
        run: bash build/asset-budget.sh

      - name: Pack
        # Both packages: IzzyBlazor (server apps) and IzzyBlazor.Core (any render mode).
        run: dotnet pack izzyblazor.sln --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output
          path: |
            artifacts/*.nupkg
            **/TestResults/*.trx

  # The library targets net10.0, and apps on .NET 11 run it there: build with the .NET 11 SDK (its
  # Razor compiler differs) and run every test on the .NET 11 runtime, rolled forward.
  dotnet-11:
    runs-on: ubuntu-latest
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install asset tools
        run: npm ci

      - name: Build
        run: dotnet build izzyblazor.sln --configuration Release

      - name: Install Chromium
        run: pwsh site/IzzyBlazor.Site.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # One test left out: bUnit's net10 build fakes Virtualize's script by calling its internal
      # OnSpacerBeforeVisible, whose parameters .NET 11 changed (bUnit's net11.0 build has the fix).
      - name: Unit and render tests
        run: dotnet test izzyblazor.sln --configuration Release --no-build --filter "FullyQualifiedName!~Virtual_rows_stay_where_they_are_for_a_parents_render"
