# The docs site on Fly.io (see Dockerfile). Deployed by the Release workflow after the packages are
# pushed, so the docs match the released version.

app = 'izzyblazor'
primary_region = 'iad'

[build]

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'

# One machine: Live examples hold a circuit on the machine that served the page.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
